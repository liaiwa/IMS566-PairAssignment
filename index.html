<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <!-- Meta Tags for SEO and Social Media -->
    <meta name="description" content="LifeFlow Blood Donation Center - Login to manage blood donation operations and save lives">
    <meta name="keywords" content="blood donation, lifeflow, login, donor management, healthcare">
    <meta name="author" content="LifeFlow Blood Donation Center">
    <meta name="robots" content="index, follow">
    <title>LifeFlow - Login</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #DC2626, #2563EB);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .login-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 0;
        }
        
        .login-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin: 2rem 0;
        }

        footer {
            margin-top: auto;
        }
        .spinner-border {
    vertical-align: middle;
    color: #dc2626; /* Red color for spinner */
}

/* Add this for the loading state button */
button:disabled {
    opacity: 0.8;
}
    </style>
</head>
<body>
    <!-- Login Content -->
    <div class="login-container">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-6 col-lg-4">
                    <div class="login-card p-4">
                        <!-- Logo with Local Image -->
                        <div class="text-center mb-4">
                            <img src="blood-test.png" 
                                 alt="Blood Donation" 
                                 width="80" 
                                 height="80">
                            <h2 class="text-danger mt-2">LifeFlow</h2>
                            <p class="text-muted">Blood Donation Center</p>
                        </div>

                        <!-- Login Form -->
                        <form id="loginForm">
                            <div class="mb-3">
                                <label for="username" class="form-label">Username</label>
                                <input type="text" class="form-control" id="username" required>
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">Password</label>
                                <input type="password" class="form-control" id="password" required>
                            </div>
                            
                            <!-- Error Message -->
                            <div id="errorMessage" class="alert alert-danger d-none">
                                Invalid username or password!
                            </div>

                            <button type="submit" class="btn btn-danger w-100">Login</button>
                        </form>

                        <!-- Test Credentials -->
                        <div class="mt-3 text-center">
                            <small class="text-muted">
                                Test credentials: admin / password123
                            </small>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

     <!-- JavaScript -->
<script>

    
    // Auto-fill the form when page loads
    window.onload = function() {
        document.getElementById('username').value = 'admin';
        document.getElementById('password').value = 'password123';
    };
    
    document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        const errorMessage = document.getElementById('errorMessage');
        const submitButton = document.querySelector('button[type="submit"]');
        
        // Show logging in message in red theme
        errorMessage.textContent = 'Logging in...';
        errorMessage.className = 'alert';
        errorMessage.classList.remove('d-none');
        
        // Custom red styling for logging in message
        errorMessage.style.backgroundColor = '#fee2e2'; // Light red background
        errorMessage.style.color = '#991b1b'; // Dark red text
        errorMessage.style.borderColor = '#fca5a5'; // Red border
        
        // Disable the submit button and change text
        submitButton.disabled = true;
        submitButton.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Logging in...';
        
        // Change button to light red while loading
        submitButton.style.backgroundColor = '#fca5a5';
        submitButton.style.borderColor = '#fca5a5';
        
        // Simulate a short loading delay (1.5 seconds)
        setTimeout(function() {
            if (username === 'admin' && password === 'password123') {
                // Redirect to dashboard
                window.location.href = 'dashboard.html';
            } else {
                // Show error (original red alert)
                errorMessage.textContent = 'Invalid username or password!';
                errorMessage.className = 'alert alert-danger';
                errorMessage.style = ''; // Reset custom styles
                errorMessage.classList.remove('d-none');
                
                // Re-enable button and reset styles
                submitButton.disabled = false;
                submitButton.textContent = 'Login';
                submitButton.style = ''; // Reset button styles
            }
        }, 1500);
    });
</script>
</body>
</html>
